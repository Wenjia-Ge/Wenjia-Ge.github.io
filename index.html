<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wenjia Ge | Robotics & Research Portfolio</title>
  <meta
    name="description"
    content="Portfolio of Wenjia Ge, an NYU Tandon M.S. student working across robotics, embodied AI, medical simulation, embedded systems, and numerical methods."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe7;
      --bg-strong: #efe5d6;
      --paper: rgba(255, 251, 245, 0.88);
      --paper-strong: rgba(255, 252, 248, 0.96);
      --ink: #14202b;
      --muted: #556270;
      --line: rgba(20, 32, 43, 0.12);
      --accent: #d96f32;
      --accent-soft: rgba(217, 111, 50, 0.14);
      --teal: #0f7a75;
      --teal-soft: rgba(15, 122, 117, 0.14);
      --navy: #193549;
      --shadow: 0 24px 60px rgba(20, 32, 43, 0.12);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(217, 111, 50, 0.16), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(15, 122, 117, 0.14), transparent 22%),
        linear-gradient(180deg, #f7f2ea 0%, #f4efe7 54%, #efe7dc 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(20, 32, 43, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20, 32, 43, 0.022) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 92%);
      z-index: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(calc(100% - 28px), var(--max-width));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      padding: 14px 18px;
      background: rgba(255, 252, 248, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 30px rgba(20, 32, 43, 0.06);
    }
